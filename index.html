<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1EC">
  <meta name="description" content="Krys Fern, web developer based in Toronto.">
  <title>Krys Fern | Web Developer in Toronto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFCC00;
      --ink: #030303;
      --paper: #F3F1EC;
      --heading-font: "Rubik", sans-serif;
      --body-font: "Barlow", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body-font);
      display: flex;
      flex-direction: column;
    }

    .site-header {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      color: var(--ink);
      text-decoration: none;
      font-family: var(--heading-font);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .availability::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 204, 0, 0.2);
    }

    main {
      width: min(1120px, calc(100% - 48px));
      flex: 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 90px 0 120px;
    }

    .hero { max-width: 900px; }

    .eyebrow {
      margin: 0 0 24px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--heading-font);
      font-size: clamp(4rem, 11vw, 9.5rem);
      line-height: 0.94;
      letter-spacing: -0.085em;
      font-weight: 600;
    }

    h1 span {
      display: block;
      width: fit-content;
      position: relative;
      z-index: 0;
    }

    h1 span::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 0.02em;
      right: -0.05em;
      bottom: 0.06em;
      height: 0.23em;
      background: var(--yellow);
    }

    .intro {
      max-width: 560px;
      margin: 38px 0 0;
      font-size: clamp(1.25rem, 2.3vw, 1.7rem);
      line-height: 1.45;
      font-weight: 500;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      font-size: 1rem;
      font-weight: 600;
    }

    .location svg { width: 18px; height: 18px; }

    .site-footer {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 22px 0 28px;
      border-top: 1px solid rgba(3, 3, 3, 0.16);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.9rem;
    }

    .site-footer p { margin: 0; }

    @media (max-width: 600px) {
      .site-header { padding: 22px 0; }
      .availability { font-size: 0.82rem; }
      main { padding: 76px 0 100px; }
      .eyebrow { margin-bottom: 20px; }
      .intro { margin-top: 30px; }
      .site-footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Krys Fern home">KF.</a>
    <div class="availability">Web developer · Toronto</div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Hello, I'm</p>
      <h1 id="hero-title">Krys <span>Fern.</span></h1>
      <p class="intro">I'm a web developer in Toronto.</p>
      <div class="location">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="10" r="2.3" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Toronto, Canada
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> Krys Fern</p>
    <p>Built with care in Toronto.</p>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
